name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: shahbazakon
          # Flutter-blue contribution dots with an orange snake; dark variant uses GitHub's dark palette.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF7A00&color_dots=#EBEDF0,#B3E5FC,#54C5F8,#0175C2,#02569B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#54C5F8
            dist/github-contribution-grid-snake.gif?color_snake=#FF7A00&color_dots=#EBEDF0,#B3E5FC,#54C5F8,#0175C2,#02569B

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
